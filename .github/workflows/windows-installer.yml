name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          $version = '0.0.4'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          }
          ./desktop/installer/build-installer.ps1 -AppVersion $version -RequireSigning -SelfSignedSigning
      - uses: actions/upload-artifact@v4
        with:
          name: EpubAtolyesi-Windows-Installer
          path: |
            desktop/installer/dist/EpubAtolyesi-Setup-x64-*.exe
            desktop/installer/dist/EpubAtolyesi-SelfSigned-v*.cer
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            desktop/installer/dist/EpubAtolyesi-Setup-x64-*.exe
            desktop/installer/dist/EpubAtolyesi-SelfSigned-v*.cer
